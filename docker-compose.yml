# Run the whole stack: docker compose up --build   →   http://localhost:8080
# Copy .env.example to .env first and fill in the secrets.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: ./PrimeHomes.API
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=PrimeHomesDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (32+ characters)}
      Database__MigrateOnStartup: "true"
      Proxy__TrustAll: "true"           # only nginx can reach the API on this network
      App__BaseUrl: ${PUBLIC_URL:-http://localhost:8080}
      Cors__Origins__0: ${PUBLIC_URL:-http://localhost:8080}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__User: ${SMTP_USER:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__From: ${EMAIL_FROM:-no-reply@primehomes.local}
    volumes:
      - uploads:/app/wwwroot/uploads
    restart: unless-stopped

  ui:
    build: ./PrimeHome.UI
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  db-data:
  uploads:
