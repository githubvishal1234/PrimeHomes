# One origin for the browser: the UI is served here and API paths are proxied to the API container.
# Same-origin is what lets the SameSite=Strict session cookies work and removes the need for CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 110m;  # up to 20 photos of 5 MB per upload

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # API, uploaded photos, health probes, sitemap and robots go to the API container.
    # (Regex locations are checked in order, so this wins over the static-file rule below.)
    location ~ ^/(api/|uploads/|health/|sitemap\.xml$|robots\.txt$) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Hashed build files never change: cache for a year.
    location ~* \.(js|css|woff2?|png|jpe?g|webp|avif|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    # Angular routes: serve the app shell, never cached, so new releases load immediately.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
